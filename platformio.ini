; PlatformIO Project Configuration File

[env:4d_systems_esp32s3_gen4_r8n16]
platform = espressif32
board = 4d_systems_esp32s3_gen4_r8n16
framework = arduino
board_build.partitions = partitions.csv
lib_deps = bodmer/TFT_eSPI
board_build.filesystem = littlefs
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
build_src_filter =
    +<main.cpp>
    +<AppGlobals.cpp>
    +<Ds1302Rtc.cpp>
    +<CsvTextReader.cpp>
    +<DisplayEffects.cpp>
    +<UsbAppMode.cpp>
    +<WirelessPortal.cpp>
    +<DeviceUuid.cpp>
    +<WavMixerI2S.cpp>
    +<Key_Drv.cpp>
build_flags =
    -D ARDUINO_USB_MODE=0
    -D ARDUINO_USB_CDC_ON_BOOT=0
    -DUSE_HSPI_PORT=1

[env:4d_systems_esp32s3_gen4_r8n16_host]
platform = espressif32
board = 4d_systems_esp32s3_gen4_r8n16
framework = arduino
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
build_src_filter =
    +<HostMain.cpp>
    +<HostWirelessPortal.cpp>
build_flags =
    -D ARDUINO_USB_MODE=0
    -D ARDUINO_USB_CDC_ON_BOOT=0
