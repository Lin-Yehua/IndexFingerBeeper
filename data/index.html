<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>&#36981;&#20174;&#37117;&#24066;&#24847;&#24535;</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="page">
    <header class="hero">
      <h1>&#36981;&#20174;&#37117;&#24066;&#24847;&#24535;</h1>
      <p>Edit <code>/data.csv</code>, or queue text for immediate screen insertion.</p>
    </header>

    <section class="card">
      <h2>1) Edit data.csv</h2>
      <div class="row">
        <button id="btnLoadCsv" type="button">Load</button>
        <button id="btnSaveCsv" type="button">Save</button>
      </div>
      <textarea id="csvBox" placeholder="id,text"></textarea>
      <p id="csvStatus" class="status"></p>
    </section>

    <section class="card">
      <h2>2) Queue immediate text</h2>
      <textarea id="msgBox" maxlength="240" placeholder="Text to display on screen"></textarea>
      <div class="row">
        <button id="btnSendMsg" type="button">Send</button>
        <button id="btnClearMsg" type="button" class="ghost">Clear</button>
      </div>
      <p id="msgStatus" class="status"></p>
    </section>

    <section class="card">
      <h2>3) Volume</h2>
      <div class="slider-row">
        <input id="volumeSlider" type="range" min="0" max="100" step="1" value="20">
        <span id="volumeValue" class="badge">20%</span>
      </div>
      <p id="volumeStatus" class="status"></p>
    </section>

    <section class="card">
      <h2>4) Host MAC (ESP-NOW source filter)</h2>
      <input id="hostMacInput" type="text" placeholder="AA:BB:CC:DD:EE:FF (empty = accept all)">
      <div class="row">
        <button id="btnSaveHostMac" type="button">Save Host MAC</button>
      </div>
      <p id="hostMacStatus" class="status"></p>
    </section>

    <section class="card">
      <h2>5) AP / ESP-NOW Channel</h2>
      <input id="apSsidInput" type="text" maxlength="32" placeholder="AP SSID">
      <div class="field"></div>
      <input id="apPasswordInput" type="text" maxlength="63" placeholder="AP Password (empty = open AP)">
      <div class="field"></div>
      <input id="apChannelInput" type="number" min="1" max="13" step="1" placeholder="Channel (1-13)">
      <div class="row">
        <button id="btnSaveApConfig" type="button">Save AP Config</button>
      </div>
      <p id="apConfigStatus" class="status"></p>
      <p class="status">Saved to <code>/setting.ini</code>, reboot required to fully apply.</p>
    </section>

    <section class="card">
      <h2>6) Device MAC</h2>
      <input id="selfMacInput" type="text" readonly>
      <div class="row">
        <button id="btnCopySelfMac" type="button" class="ghost">Copy MAC</button>
      </div>
      <p id="selfMacStatus" class="status"></p>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
