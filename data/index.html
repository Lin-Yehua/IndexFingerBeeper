<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>谨遵指令之意</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="page">
    <header class="hero">
      <h1>谨遵指令之意</h1>
      <p>哔哔机控制台</p>
    </header>

    <section class="card">
      <h2>推送消息 / 推送图片</h2>
      <div class="segmented" role="tablist" aria-label="push mode">
        <button id="tabMsg" class="seg-btn active" type="button">消息</button>
        <button id="tabImg" class="seg-btn" type="button">图片</button>
      </div>

      <div id="panelMsg" class="panel active">
        <label class="label" for="msgInput">消息内容（6行）</label>
        <textarea id="msgInput" rows="6" maxlength="240" placeholder="输入要显示的消息"></textarea>

        <label class="label" for="msgHistory">历史发送</label>
        <select id="msgHistory"></select>

        <div class="line-checks">
          <label><input id="msgImmediate" type="checkbox"> 立刻显示</label>
          <label><input id="msgPrefixEnable" type="checkbox"> 添加前缀</label>
        </div>
        <input id="msgPrefix" type="text" placeholder="前缀（保留在本地，不随发送清空）">

        <div class="btn-row">
          <button id="btnSendMsg" type="button">发送</button>
          <button id="btnClearMsg" class="ghost" type="button">清除</button>
        </div>
        <p id="msgStatus" class="status"></p>
      </div>

      <div id="panelImg" class="panel">
        <label class="label" for="portalUrl">ESP网页地址</label>
        <div class="input-btn">
          <input id="portalUrl" type="text" readonly>
          <button id="btnCopyPortalUrl" class="ghost" type="button">复制</button>
        </div>

        <label class="label" for="imgFile">上传文件</label>
        <input id="imgFile" type="file" accept=".png,.jpg,.jpeg,.gif,image/png,image/jpeg,image/gif">

        <label class="label" for="imgOffsetY">图片Y移动</label>
        <input id="imgOffsetY" type="range" min="-200" max="200" step="1" value="0">

        <div class="preview-wrap">
          <canvas id="imgPreview" width="320" height="140"></canvas>
        </div>

        <details class="advanced">
          <summary>高级设置</summary>
          <div class="grid2">
            <label>尺寸方式
              <select id="imgFitMode">
                <option value="cover">覆盖</option>
                <option value="center">中心</option>
              </select>
            </label>
            <label>图片Y偏移<input id="imgOffsetYInput" type="number" min="-200" max="200" step="1" value="0"></label>
            <label>显示中心X<input id="imgCenterX" type="number" value="160"></label>
            <label>显示中心Y<input id="imgCenterY" type="number" value="155"></label>
            <label>显示尺寸W<input id="imgWidth" type="number" min="1" max="320" value="320"></label>
            <label>显示尺寸H<input id="imgHeight" type="number" min="1" max="240" value="140"></label>
          </div>
        </details>

        <div class="btn-row">
          <button id="btnSendImg" type="button">发送图片</button>
          <button id="btnClearImg" class="ghost" type="button">清除</button>
        </div>
        <p id="imgStatus" class="status"></p>
      </div>
    </section>

    <section class="card">
      <h2>编辑指令库</h2>
      <div class="sub-card">
        <h3>指令陈列（可翻页）</h3>
        <div class="btn-row compact-row">
          <button id="btnCmdFoldAll" class="ghost" type="button">全部收起</button>
          <button id="btnCmdExpandAll" class="ghost" type="button">全部展开</button>
        </div>
        <div id="cmdList" class="list"></div>
        <div id="cmdPager" class="pager"></div>
      </div>
      <div class="sub-card">
        <h3>添加指令</h3>
        <textarea id="cmdAddInput" rows="2" placeholder="输入新增指令"></textarea>
        <div class="btn-row">
          <button id="btnCmdAdd" type="button">添加</button>
          <button id="btnCmdSave" class="ghost" type="button">保存指令库</button>
        </div>
      </div>
      <p id="cmdStatus" class="status"></p>
    </section>

    <section class="card">
      <h2>日程表系统</h2>

      <div class="sub-card">
        <h3>时间调整</h3>
        <p id="rtcNow" class="mono">当前RTC: --</p>
        <div class="grid6 compact">
          <input id="rtcYear" type="number" placeholder="年">
          <input id="rtcMonth" type="number" placeholder="月">
          <input id="rtcDay" type="number" placeholder="日">
          <input id="rtcHour" type="number" placeholder="时">
          <input id="rtcMinute" type="number" placeholder="分">
          <input id="rtcSecond" type="number" placeholder="秒">
        </div>
        <div class="btn-row">
          <button id="btnRtcSet" type="button">设置时间</button>
          <button id="btnRtcSyncPhone" class="ghost" type="button">同步手机时间</button>
        </div>
        <p id="rtcStatus" class="status"></p>
      </div>

      <div class="sub-card">
        <h3>当日日程</h3>
        <label class="label" for="scheduleDate">选择日期</label>
        <input id="scheduleDate" type="date">
        <div id="scheduleList" class="list"></div>
        <div id="schedulePager" class="pager"></div>
      </div>

      <div class="sub-card">
        <h3>添加日程</h3>
        <div class="grid3 compact">
          <input id="scheduleAddTime" type="time" value="09:00">
          <select id="scheduleAddRepeat">
            <option value="none">不重复</option>
            <option value="daily">每日重复</option>
            <option value="weekly">每周重复</option>
            <option value="monthly">每月重复</option>
            <option value="yearly">每年重复</option>
          </select>
          <button id="btnScheduleAdd" type="button">添加</button>
        </div>
        <textarea id="scheduleAddText" rows="2" placeholder="日程内容（可选）"></textarea>
        <div class="btn-row">
          <button id="btnScheduleSave" type="button">保存日程表</button>
        </div>
        <p id="scheduleStatus" class="status"></p>
      </div>
    </section>

    <section class="card">
      <h2>音量亮度背光调整</h2>
      <label class="label">背景音量 <span id="bgVolVal" class="mono">20%</span></label>
      <input id="bgVol" type="range" min="0" max="100" value="20">

      <label class="label">插入音量 <span id="insertVolVal" class="mono">20%</span></label>
      <input id="insertVol" type="range" min="0" max="100" value="20">

      <div class="grid3 compact">
        <label>亮度(0-1)<input id="backlight" type="number" min="0" max="1" step="0.01"></label>
        <label>息屏秒数(-1不息屏)<input id="backlightTime" type="number" step="1"></label>
        <label>背光关闭延时秒数(>=0)<input id="backlightCloseTime" type="number" min="0" step="1"></label>
      </div>

      <div class="btn-row">
        <button id="btnSaveDisplay" type="button">保存显示设置</button>
      </div>
      <p id="displayStatus" class="status"></p>
    </section>

    <section class="card">
      <h2>无线功能</h2>
      <div class="grid2">
        <label>AP SSID<input id="apSsid" type="text" maxlength="32"></label>
        <label>AP 密码<input id="apPassword" type="text" maxlength="63"></label>
        <label>ESP-NOW 信道<input id="apChannel" type="number" min="1" max="13" step="1"></label>
        <div class="align-end"><button id="btnSaveAp" type="button">保存AP设置</button></div>
      </div>

      <div class="grid2">
        <label>联网SSID<input id="staSsid" type="text" maxlength="32"></label>
        <label>联网密码<input id="staPassword" type="text" maxlength="63"></label>
        <label>网站指定(Net)<input id="staNet" type="text" maxlength="255" placeholder="http://example.com/random"></label>
        <div class="align-end"><button id="btnSaveSta" type="button">保存联网设置</button></div>
      </div>

      <div class="grid2">
        <label>主机过滤MAC<input id="hostMac" type="text" placeholder="AA:BB:CC:DD:EE:FF"></label>
        <div class="align-end"><button id="btnSaveHostMac" type="button">保存MAC过滤</button></div>
      </div>

      <div class="input-btn">
        <input id="selfMac" type="text" readonly>
        <button id="btnCopySelfMac" class="ghost" type="button">复制本机MAC</button>
      </div>
      <p id="wirelessStatus" class="status"></p>
    </section>

    <section class="card">
      <h2>电池电量</h2>
      <p id="batteryStatus" class="status">读取中...</p>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
